<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Password aggiornata</title>
</head>

<body style="margin:0; padding:0; background:#ececec; font-family:Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#ececec; padding:40px 0;">
    <tr>
        <td align="center">

            <table role="presentation"
                   width="600"
                   cellspacing="0"
                   cellpadding="0"
                   style="background:#ffffff;
                          border-radius:12px;
                          overflow:hidden;">

                <!-- HEADER -->
                <tr>
                    <td>
                        <img
                                src="cid:bloodyglyph-banner.png"
                                alt="BloodyGlyph"
                                style="display:block; width:100%; height:auto;"
                        >
                </tr>

                <!-- CONTENUTO -->
                <tr>
                    <td style="padding:45px;">

                        <h1 style="margin-top:0; color:#8b0000;">
                            Email aggiornata
                        </h1>

                        <p>
                            Ciao <strong>{{username}}</strong>,
                        </p>

                        <p>
                            Questa da oggi è la mail associata al tuo account.
                        </p>

                        <p>
                            Ricordati di utilizzare questo indirizzo email per i prossimi accessi.
                        </p>

                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="
                            background:#111111;
                            color:#bbbbbb;
                            text-align:center;
                            padding:30px;">

                        <strong style="color:white;">
                            BloodyGlyph
                        </strong>

                        <br><br>

                        Create • Scan • Share

                        <br><br>

                        <span style="font-size:12px;">
                            Questa è un'email automatica, non rispondere a questo messaggio.
                        </span>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
